[package]
name = "tree-sitter-all"
version = "0.1.0"
edition = "2021"
description = "Tree-sitter core + all officially supported language grammars (C ABI)"
license = "Apache-2.0"

[lib]
name = "tree_sitter_all"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Core tree-sitter runtime (C library)
tree-sitter = "0.25"

# ── Tier 1: Most popular languages ──────────────────────────────────────
tree-sitter-bash = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.23"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-markdown = "0.7"
tree-sitter-python = "0.23"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.25"
tree-sitter-sql = "0.0.2"
tree-sitter-toml = "0.20"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

# ── Tier 2: Broadly used languages ──────────────────────────────────────
tree-sitter-cmake = "0.7"
tree-sitter-dockerfile = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.15"
tree-sitter-haskell = "0.23"
tree-sitter-julia = "0.23"
tree-sitter-kotlin = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-ocaml = "0.24"
tree-sitter-php = "0.24"
tree-sitter-r = "1.2"
tree-sitter-swift = "0.7"
tree-sitter-vim = "0.4"
tree-sitter-xml = "0.7"
tree-sitter-zig = "1.1"
